<svg xmlns="http://www.w3.org/2000/svg" id="requ-cg8od" role="img" aria-labelledby="requ-cg8od-title" viewBox="0 0 1168 544" width="1168" style="max-width:100%;height:auto;background:var(--bg)"><title id="requ-cg8od-title">Customer refund</title><style>#requ-cg8od{--bg:#ffffff;--fg:#0e1d38;--muted:#536277;--line:#dce3ec;--band:#f7f9fc;--customer:#e4f5f2;--customer-line:#167969;--agent:#f1eaff;--agent-line:#7653b5;--external:#f1f3f5;--external-line:#74808e;}@media(prefers-color-scheme:dark){#requ-cg8od{--bg:#121b2b;--fg:#edf2fa;--muted:#adbdd2;--line:#34445c;--band:#192539;--customer:#173c3a;--customer-line:#71cdbd;--agent:#34264e;--agent-line:#c1a0f2;--external:#273240;--external-line:#a8b4c3;}}
