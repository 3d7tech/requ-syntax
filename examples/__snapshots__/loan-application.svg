ge" x="506" y="292">⊞</text></g><g data-requ-id="decide" class="requ-step actor-team" tabindex="0"><title>Approve?</title><path class="shape" d="M826,240L862,276L826,312L790,276Z"/><text x="826" y="280" text-anchor="middle" style="font-size:12px">Approve?</text></g><g data-requ-id="decline" class="requ-step suggested actor-team" tabindex="0"><title>Send decline letter</title><rect class="shape" x="944" y="240" width="140" height="56" rx="28"/><text x="1014" y="272" text-anchor="middle" style="font-size:12px">Send decline letter</text><text class="badge" x="1074" y="235">?</text></g><g data-requ-id="score" class="requ-step actor-agent" tabindex="0"><title>Score credit risk</title><rect class="shape" x="568" y="384" width="140" height="56" rx="7"/><text x="638" y="416" text-anchor="middle" style="font-size:12px">Score credit risk</text><text class="badge" x="570" y="379">AI</text></g><g data-requ-id="report" class="requ-step actor-external" tabindex="0"><title>Return credit report</title><rect class="shape" x="756" y="548" width="140" height="56" rx="7"/><text x="826" y="573" text-anchor="middle" style="font-size:12px">Return credit</text><text x="826" y="587" text-anchor="middle" style="font-size:12px">report</text></g></g></svg>