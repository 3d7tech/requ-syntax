<svg xmlns="http://www.w3.org/2000/svg" id="requ-1gsgbdp" role="img" aria-labelledby="requ-1gsgbdp-title" viewBox="0 0 1072 376" width="1072" style="max-width:100%;height:auto;background:var(--bg)"><title id="requ-1gsgbdp-title">Employee onboarding</title><style>#requ-1gsgbdp{--bg:#ffffff;--fg:#0e1d38;--muted:#536277;--line:#dce3ec;--band:#f7f9fc;--customer:#e4f5f2;--customer-line:#167969;--agent:#f1eaff;--agent-line:#7653b5;--external:#f1f3f5;--external-line:#74808e;}
#requ-1gsgbdp text{font-family:Inter,system-ui,sans-serif;fill:var(--fg);font-size:13px}#requ-1gsgbdp .muted{fill:var(--muted);font-size:11px}#requ-1gsgbdp .requ-edge{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}#requ-1gsgbdp .shape{fill:var(--bg);stroke:var(--fg);stroke-width:1.5}#requ-1gsgbdp .actor-customer .shape{fill:var(--customer);stroke:var(--customer-line)}#requ-1gsgbdp .actor-agent .shape{fill:var(--agent);stroke:var(--agent-line)}#requ-1gsgbdp .actor-external .shape{fill:var(--external);stroke:var(--external-line);stroke-dasharray:5 4}#requ-1gsgbdp .suggested>.shape{stroke-dasharray:5 4}#requ-1gsgbdp a{cursor:pointer}#requ-1gsgbdp .badge{font-size:10px;font-weight:700}#requ-1gsgbdp .pill{fill:var(--bg)}#requ-1gsgbdp .requ-step:focus .shape{stroke-width:3}</style><defs><marker id="requ-1gsgbdp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--muted)"/></marker></defs><g transform="translate(0 0)"><text x="16" y="32" style="font-size:20px" text-anchor="start">Employee onboarding</text><g data-requ-id="employee" class="requ-lane actor-customer"><title>New employee</title><rect x="0" y="64" width="1072" height="96" fill="var(--bg)" stroke="var(--line)"/><rect class="shape" x="0" y="64" width="160" height="96"/><path d="M8 2a3 3 0 1 0 0 6a3 3 0 0 0 0-6M2 16v-3c0-5 12-5 12 0v3" transform="translate(16 80)" fill="none" stroke="var(--fg)" stroke-width="1.2"/><text x="40" y="93" style="font-size:13px" text-anchor="start">New employee</text></g><g data-requ-id="hr" class="requ-lane actor-team"><title>People team</title><rect x="0" y="160" width="1072" height="96" fill="var(--band)" stroke="var(--line)"/><rect class="shape" x="0" y="160" width="160" height="96"/><path d="M6 2a3 3 0 1 0 0 6a3 3 0 0 0 0-6M1 16v-3c0-5 10-5 10 0v3M12 3c5 0 5 6 0 6M13 10c3 0 4 2 4 6" transform="translate(16 176)" fill="none" stroke="var(--fg)" stroke-