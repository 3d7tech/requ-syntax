 x="514" y="200" text-anchor="middle" style="font-size:12px">Prepare account</text><text x="514" y="216" text-anchor="middle" style="font-size:12px">and welcome pack</text></g><g data-requ-id="setup" class="requ-step actor-external" tabindex="0"><title>Set up payroll</title><rect class="shape" x="664" y="272" width="140" height="56" rx="7"/><text x="734" y="304" text-anchor="middle" style="font-size:12px">Set up payroll</text></g></g></svg>