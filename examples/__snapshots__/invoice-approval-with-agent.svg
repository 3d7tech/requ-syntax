<svg xmlns="http://www.w3.org/2000/svg" id="requ-bmgjl7" role="img" aria-labelledby="requ-bmgjl7-title" viewBox="0 0 1168 470" width="1168" style="max-width:100%;height:auto;background:var(--bg)"><title id="requ-bmgjl7-title">Invoice approval</title><style>#requ-bmgjl7{--bg:#ffffff;--fg:#0e1d38;--muted:#536277;--line:#dce3ec;--band:#f7f9fc;--customer:#e4f5f2;--customer-line:#167969;--agent:#f1eaff;--agent-line:#7653b5;--external:#f1f3f5;--external-line:#74808e;}
